<!doctype html>
<html lang="ja" data-astryx-theme="intentrip">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="行く時間をずらして、混雑を避ける1日のプランを組みます。" />
    <script>
      (() => {
        const ok = (v) => v === 'ja' || v === 'en'
        let l = null
        try {
          l = new URLSearchParams(location.search).get('lang')
        } catch {}
        if (!ok(l)) {
          try {
            l = localStorage.getItem('intentrip:lang')
          } catch {
            l = null
          }
        }
        if (!ok(l)) {
          const nav = navigator
          const ls = nav.languages && nav.languages.length ? nav.languages : nav.language ? [nav.language] : []
          l = ls.length ? 'en' : 'ja'
          for (const x of ls) {
            const y = x.toLowerCase()
            if (y === 'ja' || y.startsWith('ja-')) {
              l = 'ja'
              break
            }
            if (y === 'en' || y.startsWith('en-')) {
              l = 'en'
              break
            }
          }
        }
        document.documentElement.lang = l
        if (!/github\.io$/.test(location.hostname)) {
          for (const u of ['/api/sample?lang=' + l, '/api/config']) {
            const k = document.createElement('link')
            k.rel = 'preload'
            k.as = 'fetch'
            k.crossOrigin = 'anonymous'
            k.href = u
            document.head.appendChild(k)
          }
        }
        if (l === 'en') {
          document.querySelector('meta[name="description"]')?.setAttribute('content', 'Plan a day that avoids crowded times and places.')
        }
      })()
    </script>
